name: evaluation

# Re-runs the detection evaluation against the public EVTX-ATTACK-SAMPLES corpus.
# Manual only: it clones a third-party corpus and takes a few minutes.
on:
  workflow_dispatch:

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Generate synthetic benign data (deterministic)
        run: python scripts/generate_demo_data.py --out data/samples
      - name: Fetch attack corpus
        run: git clone --depth 1 https://github.com/sbousseaden/EVTX-ATTACK-SAMPLES.git /tmp/evtx
      - name: Run evaluation
        run: |
          python scripts/metrics.py \
            --train data/samples/normal/baseline_normal.json \
            --heldout-known data/samples/normal/heldout_known.json \
            --heldout-unseen data/samples/normal/heldout_unseen.json \
            --attack /tmp/evtx --min-severity medium --split test --json eval.json
      - uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: eval.json
