[project]
name = "soc-parallax-backend"
version = "0.1.0"
description = "SOC PARALLAX — Cyber Behavioral Intelligence Platform (backend)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "psycopg[binary,pool]>=3.1",
    "neo4j>=5.18",
    "httpx>=0.27",
    "python-evtx>=0.8.0",
    "pyyaml>=6.0",
    "python-dateutil>=2.9",
    "langgraph>=0.0.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff==0.15.18",
    "mypy>=1.9",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Explicit selection, not ruff's shifting defaults. ruff>=0.3 (unbounded)
# + no explicit select is exactly what broke this CI twice in one week —
# once with 2 F401s, once with 31 different errors from a newer ruff
# resolving different default-enabled rules, no code change either time.
# Pinning the version AND selecting rules explicitly closes both halves of
# that failure mode, not just one.
select = ["E", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
