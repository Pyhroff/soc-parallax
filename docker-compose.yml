services:
  postgres:
    image: postgres:16-alpine
    container_name: parallax-postgres
    environment:
      POSTGRES_USER: parallax
      POSTGRES_PASSWORD: parallax
      POSTGRES_DB: parallax
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parallax"]
      interval: 5s
      timeout: 3s
      retries: 10

  neo4j:
    image: neo4j:5-community
    container_name: parallax-neo4j
    environment:
      NEO4J_AUTH: neo4j/parallaxgraph
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474"   # browser
      - "7687:7687"   # bolt
    volumes:
      - neo4jdata:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    container_name: parallax-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollamadata:/root/.ollama
    # After first start, pull a model:  docker exec parallax-ollama ollama pull llama3

  backend:
    build: ./backend
    container_name: parallax-backend
    environment:
      PG_DSN: "postgresql://parallax:parallax@postgres:5432/parallax"
      NEO4J_URI: "bolt://neo4j:7687"
      NEO4J_USER: "neo4j"
      NEO4J_PASSWORD: "parallaxgraph"
      OLLAMA_URL: "http://ollama:11434"
      OLLAMA_MODEL: "llama3"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      ollama:
        condition: service_started
    volumes:
      - ./backend:/app
      - ./data:/data

  frontend:
    build: ./frontend
    container_name: parallax-frontend
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:8000"
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
  neo4jdata:
  ollamadata:
